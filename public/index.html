<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOVA AI</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #09090f;
      color: #fff;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    header {
      padding: 20px;
      border-bottom: 1px solid #292034;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      color: #b76cff;
      font-size: 25px;
      font-weight: bold;
    }

    .status {
      color: #aaa;
      font-size: 12px;
    }

    main {
      max-width: 850px;
      margin: auto;
      padding: 35px 16px;
    }

    .welcome {
      text-align: center;
      margin: 25px 0 35px;
    }

    .welcome h1 {
      font-size: 34px;
      margin-bottom: 12px;
    }

    .welcome span {
      color: #b76cff;
    }

    .welcome p {
      color: #aaa;
      line-height: 1.6;
    }

    .chat {
      background: #11111b;
      border: 1px solid #30213f;
      border-radius: 16px;
      overflow: hidden;
    }

    #messages {
      min-height: 250px;
      max-height: 50vh;
      overflow-y: auto;
      padding: 18px;
    }

    .message {
      margin-bottom: 16px;
      padding: 12px;
      border-radius: 10px;
      line-height: 1.6;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }

    .user {
      background: #28183a;
    }

    .bot {
      background: #1a1a27;
    }

    .label {
      color: #c58aff;
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: bold;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 12px;
      border-top: 1px solid #30213f;
    }

    textarea {
      flex: 1;
      min-width: 0;
      resize: none;
      height: 48px;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #393044;
      background: #09090f;
      color: white;
      outline: none;
      font-size: 15px;
    }

    button {
      border: none;
      background: #9b4dff;
      color: white;
      border-radius: 10px;
      padding: 0 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .note {
      color: #777;
      font-size: 12px;
      text-align: center;
      margin-top: 15px;
    }

    @media (max-width: 480px) {
      .welcome h1 { font-size: 28px; }
      main { padding: 20px 12px; }
      #messages { min-height: 220px; }
      button { padding: 0 13px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">✦ NOVA AI</div>
    <div class="status">● Asistente inteligente</div>
  </header>

  <main>
    <section class="welcome">
      <h1>Hola, soy <span>NOVA AI</span></h1>
      <p>Tu espacio de inteligencia artificial.<br>
      Pregunta, aprende y programa.</p>
    </section>

    <section class="chat">
      <div id="messages">
        <div class="message bot">
          <div class="label">NOVA AI</div>
          ¡Hola! ¿En qué puedo ayudarte hoy?
        </div>
      </div>

      <form class="input-area" id="chatForm">
        <textarea id="prompt" placeholder="Escribe tu mensaje..." required></textarea>
        <button id="send" type="submit">Enviar</button>
      </form>
    </section>

    <p class="note">NOVA AI · Inteligencia artificial</p>
  </main>

  <script>
    const form = document.getElementById('chatForm');
    const input = document.getElementById('prompt');
    const messages = document.getElementById('messages');
    const send = document.getElementById('send');
    const history = [];

    function addMessage(text, type) {
      const box = document.createElement('div');
      box.className = 'message ' + type;

      const label = document.createElement('div');
      label.className = 'label';
      label.textContent = type === 'user' ? 'Tú' : 'NOVA AI';

      const content = document.createElement('div');
      content.textContent = text;

      box.append(label, content);
      messages.appendChild(box);
      messages.scrollTop = messages.scrollHeight;
      return content;
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const text = input.value.trim();
      if (!text || send.disabled) return;

      addMessage(text, 'user');
      history.push({ role: 'user', content: text });
      input.value = '';
      send.disabled = true;

      const reply = addMessage('Pensando...', 'bot');

      try {
        const response = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history })
        });

        const data = await response.json();
        if (!response.ok) throw new Error(data.error || 'Error al consultar la IA.');

        reply.textContent = data.reply;
        history.push({ role: 'assistant', content: data.reply });
      } catch (error) {
        reply.textContent = error.message || 'No se pudo conectar. Intenta de nuevo.';
        history.pop();
      } finally {
        send.disabled = false;
        input.focus();
      }
    });
  </script>
</body>
  </html>
